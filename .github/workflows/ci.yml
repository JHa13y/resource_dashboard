name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install ruff mypy pytest
          python -m pip install -r requirements.txt
      - name: Ruff
        run: ruff check app.py tests/test_metrics.py
      - name: Mypy
        run: |
          mypy app.py > mypy-report.txt || true
          count=$(grep -c 'error:' mypy-report.txt)
          echo "mypy errors: $count (baseline: 40)"
          [ "$count" -le 40 ]
      - name: Pytest
        run: pytest
