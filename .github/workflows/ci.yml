name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install ruff mypy pytest
          python -m pip install -r requirements.txt
      - name: Ruff
        run: ruff check app.py collectors tests/
      - name: Mypy
        run: |
          mypy app.py > mypy-report.txt || true
          count=$(grep -c 'error:' mypy-report.txt)
          # Baseline = existing errors at T11 when this gate was added. It drifted to
          # 43 (3 x arg-type in collectors/gpu.py from the T13 vendor-fold call sites);
          # those are now fixed, so the gate stays at 40. Ratchet DOWN as types are
          # fixed — never raise this number to make CI green.
          echo "mypy errors: $count (baseline: 40)"
          [ "$count" -le 40 ]
      - name: Pytest
        run: pytest
