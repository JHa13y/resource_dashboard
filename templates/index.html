<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Resource Dashboard-{{ hostname }}</title>
  <script src="/static/chart.umd.min.js"></script>
  <style>
    :root {
      --bg: #1a1b2e;
      --card-bg: #232540;
      --text: #e2e8f0;
      --muted: #94a3b8;
      --green: #22c55e;
      --yellow: #eab308;
      --red: #ef4444;
      --accent: #6366f1;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Inter', system-ui, -apple-system, sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      padding: 24px;
    }

    h1 {
      text-align: center;
      font-size: 1.6rem;
      margin-bottom: 8px;
      letter-spacing: -0.5px;
    }

    .subtitle {
      text-align: center;
      color: var(--muted);
      font-size: 0.85rem;
      margin-bottom: 24px;
    }

    /* ---- Grid layout ---- */
    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(360px, 1fr));
      gap: 16px;
      max-width: 1400px;
      margin: 0 auto;
    }

    .card {
      background: var(--card-bg);
      border-radius: 12px;
      padding: 20px;
      box-shadow: 0 4px 24px rgba(0,0,0,.3);
      min-width: 0; /* grid items default to min-width:auto – allow shrinking */
    }

    .card h2 {
      font-size: 0.95rem;
      text-transform: uppercase;
      letter-spacing: 1px;
      color: var(--muted);
      margin-bottom: 12px;
    }

    /* ---- Gauge row ---- */
    .gauges {
      display: flex;
      gap: 16px;
      flex-wrap: wrap;
    }

    .gauge {
      flex: 1;
      min-width: 140px;
      text-align: center;
    }

    .gauge-value {
      font-size: 2.4rem;
      font-weight: 700;
      line-height: 1;
    }

    .gauge-label {
      font-size: 0.8rem;
      color: var(--muted);
      margin-top: 4px;
    }

    /* ---- Chart containers ---- */
    .chart-wrap {
      position: relative;
      height: 200px;
      min-width: 0; /* allow grid item to shrink below canvas content size */
    }

    /* Cap rendered canvas width so a wide canvas can never blow out its card */
    .chart-wrap canvas {
      max-width: 100%;
      display: block;
    }

    /* ---- GPU cards ---- */
    .gpu-section { grid-column: 1 / -1; }

    .gpu-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(340px, 1fr));
      gap: 16px;
    }

    .gpu-card {
      background: var(--card-bg);
      border-radius: 12px;
      padding: 20px;
      box-shadow: 0 4px 24px rgba(0,0,0,.3);
      min-width: 0; /* grid items default to min-width:auto – allow shrinking */
    }

    .gpu-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 12px;
    }

    .gpu-header h3 { font-size: 1rem; }

    /* ---- Throttle badges ---- */
    .badges { display: flex; gap: 6px; }

    .badge {
      font-size: 0.7rem;
      padding: 3px 8px;
      border-radius: 999px;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    .badge.ok { background: rgba(34,197,94,.15); color: var(--green); }
    .badge.down { background: rgba(239,68,68,.15); color: var(--red); }
    .badge.warn { background: rgba(234,179,8,.15); color: var(--yellow); }
    .badge.active {
      background: rgba(239,68,68,.2);
      color: var(--red);
      animation: pulse 1.2s ease-in-out infinite;
    }

    @keyframes pulse {
      0%, 100% { opacity: 1; }
      50% { opacity: .45; }
    }

    /* ---- Connection status ---- */
    #conn-status {
      position: fixed;
      top: 12px;
      right: 16px;
      font-size: 0.75rem;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    #conn-dot {
      width: 8px; height: 8px;
      border-radius: 50%;
      background: var(--red);
    }

    #conn-dot.connected { background: var(--green); }

    /* ---- GPU chart grid (single combined chart per card) ---- */
    .gpu-charts-grid {
      display: grid;
      grid-template-columns: 1fr;
    }

    /* ---- LLM card ---- */
    .llama-header {
      display: flex;
      align-items: center;
      gap: 12px;
      margin-bottom: 12px;
    }

    .llama-header h2 { margin-bottom: 0; }

    .llama-model {
      font-size: 0.85rem;
      color: var(--text);
      max-width: 320px;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .llama-sub {
      margin-top: 2px;
      font-size: 0.75rem;
      color: var(--muted);
    }
      white-space: nowrap;
    }

    .llama-slots {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
      gap: 10px 16px;
      margin-top: 14px;
    }

    .llama-slot-head {
      display: flex;
      justify-content: space-between;
      font-size: 0.8rem;
      color: var(--muted);
      margin-bottom: 4px;
    }

    .llama-slot-processing { color: var(--green); }

    .llama-slot-bar {
      height: 8px;
      background: rgba(255,255,255,.08);
      border-radius: 999px;
      overflow: hidden;
    }

    .llama-slot-fill {
      height: 100%;
      width: 0;
      border-radius: 999px;
      transition: width .4s;
    }

    .llama-usage-line {
      font-size: 0.9rem;
      color: var(--text);
      letter-spacing: 0.01em;
    }

    .llama-slots-note {
      margin-top: 14px;
      font-size: 0.8rem;
      color: var(--muted);
    }

    /* ---- Mobile responsive fixes ---- */
    @media (max-width: 768px) {
      body {
        padding: 12px;
      }

      h1 {
        font-size: 1.3rem;
      }

      .grid {
        grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
      }

      .gpu-grid {
        grid-template-columns: repeat(auto-fit, minmax(260px, 1fr));
      }

      .chart-wrap {
        height: 150px;
      }

      .gauge {
        min-width: 100px;
      }

      .gauge-value {
        font-size: 1.8rem;
      }

      .gpu-card {
        padding: 14px;
      }

      #conn-status {
        top: 6px;
        right: 8px;
        font-size: 0.65rem;
      }

      #conn-dot {
        width: 6px;
        height: 6px;
      }
    }

    /* ---- System tabs (multi-system consolidation) ---- */
    .sys-tabs {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
      justify-content: center;
      margin-bottom: 16px;
    }

    .sys-tab {
      display: flex;
      align-items: center;
      gap: 6px;
      background: var(--card-bg);
      color: var(--muted);
      border: 1px solid transparent;
      border-radius: 999px;
      padding: 6px 14px;
      font-size: 0.8rem;
      font-weight: 600;
      cursor: pointer;
    }

    .sys-tab.active {
      color: var(--text);
      border-color: var(--accent);
      background: rgba(99,102,241,.15);
    }

    .dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      display: inline-block;
      flex: none;
    }

    .dot.up { background: var(--green); }
    .dot.stale { background: var(--yellow); }
    .dot.down { background: var(--red); }

    /* ---- Fleet summary strip ---- */
    .fleet-row {
      display: grid;
      grid-template-columns: 2fr 1fr 1fr 1fr 1.2fr;
      gap: 8px;
      align-items: center;
      padding: 6px 0;
      border-bottom: 1px solid rgba(255,255,255,.06);
      font-size: 0.85rem;
    }

    .fleet-row.head {
      color: var(--muted);
      font-size: 0.7rem;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    .fleet-name {
      display: flex;
      align-items: center;
      gap: 8px;
      font-weight: 600;
    }

    .fleet-val { text-align: right; }
  </style>
</head>
<body>

  <div id="conn-status">
    <span id="conn-dot"></span>
    <span id="conn-text">Connecting…</span>
  </div>

  <h1>⚡ Resource Dashboard-{{ hostname }}</h1>
  <p class="subtitle" id="clock"></p>

  <!-- System tabs (multi-system consolidation; the default tab is
       configurable: default_view: local | fleet, default local) -->
  <div class="sys-tabs" id="sys-tabs"></div>

  <!-- Fleet (summary) view: shown while the Fleet tab is selected -->
  <div class="gpu-section" id="fleet-section" style="margin-top:16px;">
    <div class="card">
      <h2>Fleet tokens/s</h2>
      <div id="fleet-strip"></div>
      <div class="chart-wrap" style="margin-top:16px;"><canvas id="fleetChart"></canvas></div>
    </div>
  </div>

  <!-- Per-system detail sections (hidden while the Fleet tab is selected) -->
  <div id="detail-sections" style="display:none;">

  <!-- GPU section -->
  <div class="gpu-section" style="margin-top:16px;">
    <div class="gpu-grid" id="gpu-container">
      <!-- GPU cards injected by JS -->
    </div>
  </div>

  <!-- Local LLM section (hidden when the dashboard runs with --no-llama).
       Multi-LLM: one card per configured target, cloned from the
       template by renderLLMCards() and keyed per (system, llm name). -->
  <div class="gpu-section" id="llm-cards-container" style="margin-top:16px;"></div>

  <template id="llm-card-template">
    <div class="card llm-card">
      <div class="llama-header">
        <h2>Local LLM <span class="llm-name" style="display:none;font-weight:normal;font-size:0.9rem;color:#cbd5e1;"></span><span class="llm-backend" style="font-weight:normal;font-size:0.8rem;color:#94a3b8;"></span></h2>
        <span class="llama-model llm-model">–</span>
        <span class="llm-status badge down">unreachable</span>
        <span class="llm-stalled badge down" style="display:none;">stalled</span>
        <span class="llama-model llm-slots-free" style="display:none;"></span>
      </div>
      <div class="llama-sub llm-build" style="display:none;"></div>
      <div class="gauges">
        <div class="gauge">
          <div class="gauge-value llm-gen">–</div>
          <div class="gauge-label">Gen tokens/s</div>
        </div>
        <div class="gauge">
          <div class="gauge-value llm-prompt">–</div>
          <div class="gauge-label llm-prompt-label">Prompt tokens/s</div>
        </div>
        <div class="gauge">
          <div class="gauge-value llm-busy">–</div>
          <div class="gauge-label">Requests (processing/deferred)</div>
        </div>
        <div class="gauge">
          <div class="gauge-value llm-ctx">–</div>
          <div class="gauge-label llm-ctx-label">Context high-water (tokens)</div>
        </div>
        <div class="gauge llm-spec-gauge" style="display:none;">
          <div class="gauge-value llm-spec">–</div>
          <div class="gauge-label">spec accept (lifetime)</div>
        </div>
      </div>
      <!-- per-backend sub-lines (hidden for other backends) -->
      <div class="llm-vllm-details" style="display:none;margin-top:10px;font-size:0.85rem;color:#94a3b8;">
        <span class="d-ttft">TTFT –</span><span class="d-itl"> · ITL –</span><span class="d-e2e"> · E2E –</span><span class="d-prefix"> · prefix cache –</span><span class="d-kv"> · KV –</span>
      </div>
      <div class="llm-litellm-details" style="display:none;margin-top:10px;font-size:0.85rem;color:#94a3b8;">
        <span class="d-ttft">TTFT –</span><span class="d-itl"> · ITL –</span><span class="d-e2e"> · E2E –</span><span class="d-api"> · API –</span><span class="d-prefix"> · prefix cache –</span><span class="d-failed"> · failed –</span>
      </div>
      <div class="llm-strata-details" style="display:none;margin-top:10px;font-size:0.85rem;color:#94a3b8;">
        <span class="d-ttft">TTFT –</span><span class="d-itl"> · ITL –</span><span class="d-e2e"> · E2E –</span><span class="d-reuse"> · KV reuse –</span><span class="d-engine"> · engine –</span>
      </div>
      <div class="llama-slots llm-slots"></div>
      <div class="llama-slots-note llm-slots-note" style="display:none;">no slot data (server started with --no-slots?)</div>
      <div class="llama-slots-note llm-peak-ctx" style="display:none;"></div>
      <div class="chart-wrap" style="margin-top:16px;"><canvas class="llm-chart"></canvas></div>
      <div class="llm-usage" style="display:none;margin-top:12px;">
        <div class="gauge-label">LLM Usage (since server start)</div>
        <div class="llama-usage-line llm-usage-line">–</div>
      </div>
      <div class="llm-proc" style="display:none;margin-top:8px;">
        <div class="gauge-label">LLM Server Process</div>
        <div class="llama-usage-line llm-proc-line">–</div>
      </div>
    </div>
  </template>

  <!-- System row -->
  <div class="grid" style="margin-top:16px;">
    <div class="card">
      <h2>CPU &amp; Memory</h2>
      <div class="gauges">
        <div class="gauge">
          <div class="gauge-value" id="cpu-val">–</div>
          <div class="gauge-label">CPU %</div>
        </div>
        <div class="gauge">
          <div class="gauge-value" id="mem-val">–</div>
          <div class="gauge-label">Memory %</div>
        </div>
        <div class="gauge">
          <div class="gauge-value" id="mem-detail">–</div>
          <div class="gauge-label">Available RAM (of total)</div>
        </div>
      </div>
    </div>

    <div class="card">
      <h2>CPU Trend (60 s)</h2>
      <div class="chart-wrap"><canvas id="cpuChart"></canvas></div>
    </div>

    <div class="card">
      <h2>Memory Trend (60 s)</h2>
      <div class="chart-wrap"><canvas id="memChart"></canvas></div>
    </div>
  </div>

  <!-- Extra cards at the bottom (after Memory Trend), in order:
       Swap → Host Health  (LLM usage/process are per-card now) -->
  <div class="grid" id="bottom-cards" style="margin-top:16px;">
    <div class="card" id="swap-card" style="display:none;">
      <h2>Swap</h2>
      <div class="gauges">
        <div class="gauge">
          <div class="gauge-value" id="swap-val">–</div>
          <div class="gauge-label" id="swap-label">Swap used</div>
        </div>
      </div>
      <div class="llama-usage-line" id="swap-io" style="margin-top:8px;">–</div>
    </div>
    <div class="card" id="host-health-card">
      <h2>Host Health</h2>
      <div class="llama-usage-line" id="host-health-line">–</div>
    </div>
  </div>

  </div><!-- /detail-sections -->

<script>
/* ------------------------------------------------------------------ */
/* Helpers                                                             */
/* ------------------------------------------------------------------ */
const MAX_POINTS = 60;

/* ------------------------------------------------------------------ */
/* Multi-system consolidation (Fleet + per-system tabs)                */
/* ------------------------------------------------------------------ */
const sysState = {
  selected: '{{ default_view or 'local' }}',
  // name -> {status, metrics, llms: Map<llmName, {backend, hist}>}
  systems: new Map(),
};

// The most recent top-level payload. The LOCAL system's detail data is
// this payload (its systems[].metrics is a slim fleet projection, not
// the full re-embedding); peers use their systems[].metrics (full
// projection). See detailMetrics().
let lastPayload = null;

function detailMetrics(name) {
  if (name === 'local') return lastPayload;
  const s = sysState.systems.get(name);
  return s ? s.metrics : null;
}

function freshHist() {
  return { labels: [], gen: [], prompt: [], perModel: {} };
}

/* Per-system line colors (stable: color = position in the sorted
   system list, same pattern as MODEL_LINE_COLORS). */
const SYSTEM_LINE_COLORS = ['#a78bfa', '#f472b6', '#fbbf24', '#34d399',
  '#fb7185', '#60a5fa', '#4ade80', '#facc15'];

function dotClass(status) {
  return status === 'up' ? 'up' : status === 'stale' ? 'stale' : 'down';
}

/* Tab row: Fleet + one tab per system, each with a status dot. */
function updateTabs(systems) {
  const container = document.getElementById('sys-tabs');
  const names = ['fleet', ...systems.map(s => s.name)];
  for (const child of [...container.children]) {
    if (!names.includes(child.dataset.sys)) child.remove();
  }
  for (const name of names) {
    let tab = [...container.children].find(el => el.dataset.sys === name);
    if (!tab) {
      tab = document.createElement('button');
      tab.className = 'sys-tab';
      tab.dataset.sys = name;
      tab.innerHTML = '<span class="dot down"></span>' +
        '<span class="sys-tab-label"></span>';
      tab.addEventListener('click', () => selectSystem(name));
      container.appendChild(tab);
    }
    const status = name === 'fleet' ? 'up'
      : ((systems.find(s => s.name === name) || {}).status || 'down');
    tab.querySelector('.dot').className = `dot ${dotClass(status)}`;
    tab.querySelector('.sys-tab-label').textContent =
      name === 'fleet' ? 'Fleet' : name;
    tab.classList.toggle('active', name === sysState.selected);
  }
}

/* Per-system state update + trend-buffer push (one SSE tick).
   Buffers grow on up + non-stale ticks; freeze on stale (entry status
   or inner LLM status — held values are not new data); gap on down
   (labels advance, values null). A backend change resets that TARGET's
   history. Multi-LLM: each system carries per-LLM-name buffers (s.llms);
   the fleet view consumes a tail-aligned summed series. */
function updateSystemEntry(name, status, metrics) {
  let s = sysState.systems.get(name);
  if (!s) {
    s = { status: null, metrics: null, llms: new Map() };
    sysState.systems.set(name, s);
  }
  s.status = status;
  s.metrics = metrics;
  if (!metrics) {
    // System down past the hold: gap-tick every existing target buffer.
    if (status === 'down') {
      for (const t of s.llms.values()) gapTick(t.hist);
    }
    return;
  }
  if (metrics.llm_enabled === false) return; // no scraping: no buffers
  const entries = normalizeLlms(metrics, name);
  // Targets removed from the config drop their buffers (the payload is
  // the truth only for new-shape payloads; the llm shim is synthetic).
  if (Array.isArray(metrics.llms)) {
    const keep = new Set(entries.map(e => e.name));
    for (const k of [...s.llms.keys()]) {
      if (!keep.has(k)) s.llms.delete(k);
    }
  }
  for (const entry of entries) {
    let t = s.llms.get(entry.name);
    if (!t) {
      t = { backend: null, hist: freshHist() };
      s.llms.set(entry.name, t);
    }
    const backend = entry.backend || 'llama';
    if (t.backend !== null && t.backend !== backend) t.hist = freshHist();
    t.backend = backend;
    const h = t.hist;
    if (status === 'down') {
      // Gap tick: labels advance, values null (no new models added).
      gapTick(h);
    } else if (status === 'stale' || entry.status === 'stale'
               || entry.status === 'down') {
      continue; // freeze: held/missing values are not new data
                // (also skips the trim below, as the single-target build did)
    } else {
      h.labels.push(nowLabel());
      h.gen.push(entry.gen_tokens_per_s ?? null);
      h.prompt.push(entry.prompt_tokens_per_s ?? null);
      const byModel = entry.gen_tokens_per_s_by_model;
      if (byModel && Object.keys(byModel).length > 1) {
        for (const model of Object.keys(byModel)) {
          (h.perModel[model] = h.perModel[model] || [])
            .push(byModel[model] ?? null);
        }
      }
    }
    if (h.labels.length > MAX_POINTS) {
      h.labels.shift();
      h.gen.shift();
      h.prompt.shift();
      for (const k of Object.keys(h.perModel)) h.perModel[k].shift();
    }
  }
}

function gapTick(h) {
  h.labels.push(nowLabel());
  h.gen.push(null);
  h.prompt.push(null);
  for (const k of Object.keys(h.perModel)) h.perModel[k].push(null);
}

/* Normalize a system's metrics payload into a list of LLM entries.
   New builds ship `llms[]`; version-skewed payloads carrying only `llm`
   shim to one entry (backend defaults to llama). Single source of truth
   for the version skew: fleet strip, charts and cards all go through
   this. */
function normalizeLlms(metrics, systemName) {
  if (Array.isArray(metrics && metrics.llms)) {
    return metrics.llms.map(e => ({ ...e, backend: e.backend || 'llama' }));
  }
  const llm = metrics && metrics.llm;
  const e = llm ? { ...llm } : { status: 'down' };
  return [{ ...e,
            name: systemName || 'primary',
            backend: e.backend || 'llama' }];
}

/* Sum of a system's per-target series, tail-aligned (frozen buffers lag
   in length exactly like cross-system buffers do in syncFleetChart). */
function systemSumSeries(s, key) {
  const arrs = [...s.llms.values()].map(t => t.hist[key]);
  const maxLen = Math.max(0, ...arrs.map(a => a.length));
  const out = new Array(maxLen).fill(null);
  for (const a of arrs) {
    const off = maxLen - a.length;
    for (let i = 0; i < a.length; i++) {
      if (a[i] != null) out[off + i] = (out[off + i] ?? 0) + a[i];
    }
  }
  return out;
}

function systemLabels(s) {
  let best = [];
  for (const t of s.llms.values()) {
    if (t.hist.labels.length > best.length) best = t.hist.labels;
  }
  return best;
}

/* Fleet summary strip: one row per system
   (name + status dot + CPU % + mem % + GPU % max + LLM gen tokens/s). */
function updateFleetStrip(systems) {
  const strip = document.getElementById('fleet-strip');
  strip.innerHTML = '';
  const head = document.createElement('div');
  head.className = 'fleet-row head';
  head.innerHTML = '<span>System</span><span class="fleet-val">CPU</span>' +
    '<span class="fleet-val">Mem</span><span class="fleet-val">GPU</span>' +
    '<span class="fleet-val">Gen tok/s</span>';
  strip.appendChild(head);
  for (const s of systems) {
    const mm = s.metrics || {};
    // GPU column: one percentage per GPU card, in GPU-index order,
    // comma-separated (unreported cards show '–'; no GPUs '–').
    const gpus = mm.gpus || [];
    const gpuVal = gpus.length
      ? gpus.map(g => g.utilization_pct != null
          ? `${g.utilization_pct}%` : '–').join(',')
      : null;
    const row = document.createElement('div');
    row.className = 'fleet-row';
    // Gen tok/s: sum over this system's LLM targets that are up OR stale
    // (stale entries carry held values — matching the single-target build,
    // which displayed the held mm.llm value).
    const gens = normalizeLlms(mm, s.name)
      .filter(e => e.status === 'up' || e.status === 'stale')
      .map(e => e.gen_tokens_per_s).filter(v => v != null);
    const genVal = gens.length
      ? Math.round(gens.reduce((a, b) => a + b, 0) * 10) / 10 : null;
    row.innerHTML =
      `<span class="fleet-name"><span class="dot ${dotClass(s.status)}"></span>${s.name}</span>` +
      `<span class="fleet-val">${mm.cpu != null ? `${mm.cpu}%` : '–'}</span>` +
      `<span class="fleet-val">${mm.memory && mm.memory.percent != null ? `${mm.memory.percent}%` : '–'}</span>` +
      `<span class="fleet-val">${gpuVal != null ? gpuVal : '–'}</span>` +
      `<span class="fleet-val">${genVal != null ? genVal : '–'}</span>`;
    strip.appendChild(row);
  }
}

let fleetChart = null;
function ensureFleetChart() {
  if (fleetChart) return fleetChart;
  const ctx = document.getElementById('fleetChart').getContext('2d');
  fleetChart = new Chart(ctx, {
    type: 'line',
    data: { labels: [], datasets: [] },
    options: {
      ...chartDefaults,
      scales: {
        ...chartDefaults.scales,
        y: {
          ...chartDefaults.scales.y,
          max: null, // tokens/s is unbounded – autoscale
          title: { display: true, text: 'tokens/s', color: '#22d3ee', font: { size: 11 } },
        },
      },
    },
  });
  return fleetChart;
}

/* Fleet tokens/s: total = filled area, per-system = non-filled lines
   over it (order: -1). Series are tail-aligned: buffers grow only on
   non-stale ticks, so shorter buffers align to the most recent points.
   Total = sum of the non-null values at each index; an all-null index
   is null (a gap, not a misleading flatline at zero). */
function syncFleetChart() {
  const chart = ensureFleetChart();
  const names = [...sysState.systems.keys()].sort();
  const series = {};
  let maxLen = 0;
  for (const n of names) {
    // One line per SYSTEM: the tail-aligned sum over its LLM targets.
    const gen = systemSumSeries(sysState.systems.get(n), 'gen');
    series[n] = gen;
    if (gen.length > maxLen) maxLen = gen.length;
  }
  const capped = Math.min(maxLen, MAX_POINTS);
  let labels = [];
  for (const n of names) {
    const lab = systemLabels(sysState.systems.get(n));
    if (maxLen > 0 && lab.length === maxLen) { labels = lab; break; }
  }
  chart.data.labels = labels.length ? labels.slice(-capped) : [];
  const total = new Array(capped).fill(null);
  for (let i = 0; i < capped; i++) {
    let sum = null;
    for (const n of names) {
      const gen = series[n];
      const idx = gen.length - capped + i;
      if (idx >= 0 && gen[idx] != null) sum = (sum == null ? 0 : sum) + gen[idx];
    }
    total[i] = sum;
  }
  const datasets = [{
    label: 'Total',
    data: total,
    borderColor: '#22d3ee',
    borderWidth: 2,
    pointRadius: 0,
    tension: 0.35,
    fill: { target: 'origin', above: hexToRgba('#22d3ee', 0.15) },
    order: 0,
  }];
  names.forEach((n, i) => {
    const gen = series[n];
    const pad = capped - Math.min(gen.length, capped);
    datasets.push({
      label: n,
      data: (pad > 0 ? new Array(pad).fill(null) : []).concat(gen.slice(-capped)),
      borderColor: SYSTEM_LINE_COLORS[i % SYSTEM_LINE_COLORS.length],
      borderWidth: 1.5,
      pointRadius: 0,
      tension: 0.35,
      fill: false,
      order: -1, // draw over the total area
    });
  });
  chart.data.datasets = datasets;
  chart.options.plugins.legend = {
    display: names.length > 0,
    position: 'bottom',
    labels: { color: '#94a3b8', boxWidth: 12, font: { size: 10 } },
  };
  chart.update('none');
}

/* Restore-style chart refresh lives on the LLMCard object (the per-target
   buffers in sysState are the source of truth; cards mirror them every
   render, so tab switches and backend-switch resets need no dedicated
   restore/push path). */

/* CPU/mem/GPU trend charts reset on tab switch (v1 behavior; per-system
   buffers for those are a v2 candidate). GPU cards are rebuilt on the
   next tick for the newly selected system. */
function resetDetailCharts() {
  if (cpuChart) {
    cpuChart.data.labels = [];
    cpuChart.data.datasets.forEach(ds => ds.data = []);
    cpuChart.update('none');
  }
  memChart.data.labels = [];
  memChart.data.datasets[0].data = [];
  memChart.update('none');
  document.getElementById('gpu-container').innerHTML = '';
  for (const k of Object.keys(gpuCharts)) delete gpuCharts[k];
}

/* Apply the selected view to the layout. Idempotent: run at load (the
   markup default must not decide — sysState.selected comes from
   default_view) and on every tab click, including clicks on the tab
   that already looks selected. Also reveals/hides the LLM card
   container from the current metrics (--no-llama). */
function applySelectedView() {
  const isFleet = sysState.selected === 'fleet';
  document.getElementById('fleet-section').style.display =
    isFleet ? '' : 'none';
  document.getElementById('detail-sections').style.display =
    isFleet ? 'none' : '';
  const s = sysState.systems.get(sysState.selected);
  const container = document.getElementById('llm-cards-container');
  if (container) container.style.display =
    s && s.metrics && s.metrics.llm_enabled === false ? 'none' : '';
}
applySelectedView();

/* Tab switch: Fleet <-> per-system. Restores the selected system's
   buffers (never a reset) and re-renders all cards from its retained
   metrics. */
function selectSystem(name) {
  if (name === sysState.selected) {
    // Re-click of the current tab: layout must still match the state
    // (fresh loads and default_view changes must never desync).
    applySelectedView();
    return;
  }
  sysState.selected = name;
  applySelectedView();
  const isFleet = name === 'fleet';
  if (isFleet) {
    const systems = [...sysState.systems.keys()].map(k => ({
      name: k, status: sysState.systems.get(k).status,
      metrics: sysState.systems.get(k).metrics,
    }));
    updateTabs(systems);
    updateFleetStrip(systems);
    syncFleetChart();
    return;
  }
  const s = sysState.systems.get(name);
  resetDetailCharts();
  if (s && s.metrics) {
    // Local system: detail data is the top-level payload (its
    // systems[].metrics is a slim fleet projection). Peers: their
    // systems[].metrics (full projection).
    const sm = detailMetrics(name);
    if (sm) {
      updateSystem(sm);
      updateGPUs(sm.gpus || []);
      renderLLMCards();
      updateSwap(sm);
      updateHostHealth(sm);
    }
  }
}

function colorFor(pct) {
  if (pct == null) return '#94a3b8';
  if (pct < 60) return '#22c55e';
  if (pct < 85) return '#eab308';
  return '#ef4444';
}

function nowLabel() {
  const d = new Date();
  return d.toLocaleTimeString('en-GB'); // HH:MM:SS
}

const chartDefaults = {
  responsive: true,
  maintainAspectRatio: false,

  plugins: { legend: { display: false } },
  scales: {
    x: { ticks: { color: '#94a3b8', maxTicksLimit: 8 }, grid: { color: 'rgba(255,255,255,.06)' } },
    y: { min: 0, max: 100, ticks: { color: '#94a3b8' }, grid: { color: 'rgba(255,255,255,.06)' } },
  },
};

function hexToRgba(hex, alpha) {
  const r = parseInt(hex.slice(1, 3), 16);
  const g = parseInt(hex.slice(3, 5), 16);
  const b = parseInt(hex.slice(5, 7), 16);
  return 'rgba(' + r + ',' + g + ',' + b + ',' + alpha + ')';
}

const memChart = makeLineChart('memChart', 'Memory %', '#22d3ee');

/* CPU trend: one thin line per core + total CPU as a shaded area under a bold line.
   Built lazily on the first SSE message so we know the core count. */
let cpuChart = null;
let cpuCoreCount = 0;

function coreColor(i, total) {
  const hue = Math.round((i * 360) / Math.max(total, 1)) % 360;
  return `hsl(${hue}, 75%, 62%)`;
}

function buildCpuChart(cores) {
  if (cpuChart) cpuChart.destroy();
  cpuCoreCount = cores;

  const datasets = [{
    label: 'All CPUs',
    data: [],
    borderColor: '#6366f1',
    borderWidth: 2.5,
    pointRadius: 0,
    tension: 0.35,
    fill: { target: 'origin', above: hexToRgba('#6366f1', 0.25) },
    order: 0,
  }];
  for (let i = 0; i < cores; i++) {
    datasets.push({
      label: `CPU ${i}`,
      data: [],
      borderColor: coreColor(i, cores),
      borderWidth: 1,
      pointRadius: 0,
      tension: 0.35,
      fill: false,
      hidden: false,
      order: 1,
    });
  }

  const ctx = document.getElementById('cpuChart').getContext('2d');
  cpuChart = new Chart(ctx, {
    type: 'line',
    data: { labels: [], datasets },
    options: {
      ...chartDefaults,
      plugins: {
        legend: {
          display: true,
          position: 'bottom',
          labels: {
            color: '#94a3b8',
            boxWidth: 10,
            boxHeight: 2,
            font: { size: 10 },
            padding: 8,
            // Only show "All CPUs" – per-core lines appear in the hover tooltip
            filter: (item) => item.datasetIndex === 0,
          },

        tooltip: {
          // Sort entries by value so the hottest core is on top
          itemSort: (a, b) => (b.parsed.y ?? -1) - (a.parsed.y ?? -1),
        },

}

/* GPU chart registry – keyed by GPU index */
const gpuCharts = {};

/* ------------------------------------------------------------------ */
/* SSE connection                                                      */
/* ------------------------------------------------------------------ */
const connDot  = document.getElementById('conn-dot');
const connText = document.getElementById('conn-text');

function setConnected(ok) {
  connDot.classList.toggle('connected', ok);
  connText.textContent = ok ? 'Live' : 'Disconnected';
}

const source = new EventSource('/events');

source.addEventListener('error', () => setConnected(false));
source.onopen = () => setConnected(true);

source.onmessage = (e) => {
  const m = JSON.parse(e.data);
  lastPayload = m;
  /* Multi-system: per-system state + trend buffers first. The fallback
     covers a version-skewed payload without `systems`. */
  const systems = Array.isArray(m.systems) && m.systems.length
    ? m.systems : [{ name: 'local', status: 'up', metrics: m }];
  for (const s of systems) {
    updateSystemEntry(s.name, s.status, s.metrics);
  }
  updateTabs(systems);
  if (sysState.selected === 'fleet') {
    updateFleetStrip(systems);
    syncFleetChart();
  } else {
    const s = sysState.systems.get(sysState.selected);
    if (s && s.metrics) {
      // Local system: detail data is the top-level payload (its
      // systems[].metrics is a slim fleet projection). Peers: their
      // systems[].metrics (full projection).
      const sm = detailMetrics(sysState.selected);
      if (sm) {
        updateSystem(sm);
        updateGPUs(sm.gpus || []);
        // Card reconcile + gauge/chart refresh from the per-target buffers
        // (backend-switch resets are visible in the buffers already —
        // updateSystemEntry applied them before this call).
        renderLLMCards();
        updateSwap(sm);
        updateHostHealth(sm);
      }
    }
    // metrics == null (system down, hold expired): keep the last
    // rendered state; the tab's red dot carries the down signal.
  }
};

/* ------------------------------------------------------------------ */
/* System gauges + charts                                              */
/* ------------------------------------------------------------------ */
function updateSystem(m) {
  // Gauges
  const cpuEl = document.getElementById('cpu-val');
  const memEl = document.getElementById('mem-val');
  const detailEl = document.getElementById('mem-detail');

  cpuEl.textContent = m.cpu != null ? `${m.cpu}%` : '–';
  cpuEl.style.color = colorFor(m.cpu);

  memEl.textContent = m.memory?.percent != null ? `${m.memory.percent}%` : '–';
  memEl.style.color = colorFor(m.memory?.percent);

  if (m.memory) {
    detailEl.textContent = `${m.memory.available_gb} GB available of ${m.memory.total_gb} GB`;
  }

  // Charts
  const label = nowLabel();

  /* CPU chart – (re)build if core count is new/changed (e.g. CPU hotplug).
     Peers have no cpu_per_core (dropped by design): render only the
     "All CPUs" line, not a misleading flat-zero per-core line. */
  const hasPerCore = Array.isArray(m.cpu_per_core) && m.cpu_per_core.length > 0;
  const perCore = hasPerCore ? m.cpu_per_core : [];
  const coreCount = hasPerCore ? perCore.length : 0;
  if (!cpuChart || coreCount !== cpuCoreCount) {
    buildCpuChart(coreCount);
  }
  cpuChart.data.labels.push(label);
  cpuChart.data.datasets[0].data.push(m.cpu);
  for (let i = 0; i < perCore.length; i++) {
    cpuChart.data.datasets[i + 1].data.push(perCore[i]);
  }
  if (cpuChart.data.labels.length > MAX_POINTS) {
    cpuChart.data.labels.shift();
    cpuChart.data.datasets.forEach(ds => ds.data.shift());
  }
  cpuChart.update('none');

  /* Memory chart */
  memChart.data.labels.push(label);
  memChart.data.datasets[0].data.push(m.memory?.percent ?? null);
  if (memChart.data.labels.length > MAX_POINTS) {
    memChart.data.labels.shift();
    memChart.data.datasets[0].data.shift();
  }
  memChart.update('none');

  // Clock subtitle
  document.getElementById('clock').textContent = new Date().toLocaleString();
}

/* ------------------------------------------------------------------ */
/* GPU cards (dynamic creation)                                        */
/* ------------------------------------------------------------------ */
function updateGPUs(gpus) {
  const container = document.getElementById('gpu-container');

  for (const gpu of gpus) {
    let card = document.getElementById(`gpu-${gpu.index}`);

    /* Create card on first sight */
    if (!card) {
      card = document.createElement('div');
      card.id = `gpu-${gpu.index}`;
      card.className = 'gpu-card';

      const vendor = (typeof gpu.board_vendor === 'string' ? gpu.board_vendor : '').trim();
      const isVendor = !!vendor && vendor.toLowerCase() !== 'unknown' && !/^0x[0-9a-f]+$/i.test(vendor);
      // On mixed-vendor boxes make the chip vendor explicit on AMD cards
      // (NVIDIA is the historical default and stays unadorned).
      const chip = gpu.vendor === 'amd' ? 'AMD · ' : '';
      const title = isVendor
        ? `GPU ${gpu.index} · ${chip}${vendor} · ${gpu.name || `GPU ${gpu.index}`}`
        : `GPU ${gpu.index}: ${chip}${gpu.name || `GPU ${gpu.index}`}`;

      card.innerHTML = `
        <div class="gpu-header">
          <h3>${title}</h3>
          <div class="badges">
            <span id="badge-hw-${gpu.index}" class="badge ok">HW Thermal</span>
            <span id="badge-sw-${gpu.index}" class="badge ok">SW Thermal</span>
          </div>
        </div>
        <div class="gauges" style="margin-bottom:12px;">
          <div class="gauge">
            <div class="gauge-value" id="gpu-util-${gpu.index}">–</div>
            <div class="gauge-label">Util %</div>
          </div>
          <div class="gauge">
            <div class="gauge-value" id="gpu-mem-${gpu.index}">–</div>
            <div class="gauge-label" id="gpu-mem-label-${gpu.index}">Mem %</div>
          </div>
          <div class="gauge">
            <div class="gauge-value" id="gpu-temp-${gpu.index}">–</div>
            <div class="gauge-label">Temp °C</div>
          </div>
          <div class="gauge">
            <div class="gauge-value" id="gpu-clock-${gpu.index}">–</div>
            <div class="gauge-label">Clock MHz</div>
          </div>
          <div class="gauge">
            <div class="gauge-value" id="gpu-power-${gpu.index}">–</div>
            <div class="gauge-label" id="gpu-power-label-${gpu.index}">Power W</div>
          </div>
        </div>
        <div class="gpu-charts-grid">
          <div class="chart-wrap"><canvas id="gpu-util-chart-${gpu.index}"></canvas></div>
        </div>`;
      container.appendChild(card);

      /* Per-GPU combined chart */
      gpuCharts[gpu.index] = makeGpuChart(`gpu-util-chart-${gpu.index}`);
    }

    /* Update gauges */
    const utilEl  = document.getElementById(`gpu-util-${gpu.index}`);
    const memEl   = document.getElementById(`gpu-mem-${gpu.index}`);
    const tempEl  = document.getElementById(`gpu-temp-${gpu.index}`);
    const clockEl = document.getElementById(`gpu-clock-${gpu.index}`);

    /* Gauges: JetPack omits fields it cannot source (late boot, no sensor,
       N/A from nvidia-smi) — render '–' instead of 'undefined'. */
    utilEl.textContent  = gpu.utilization_pct != null ? `${gpu.utilization_pct}%` : '–';
    utilEl.style.color  = colorFor(gpu.utilization_pct);

    memEl.textContent   = gpu.memory_pct != null ? `${gpu.memory_pct}%` : '–';
    memEl.style.color   = colorFor(gpu.memory_pct);

    tempEl.textContent  = gpu.temperature_c != null ? `${gpu.temperature_c}°C` : '–';
    tempEl.style.color  = gpu.temperature_c != null
      ? (gpu.temperature_c > 85 ? '#ef4444' : gpu.temperature_c > 70 ? '#eab308' : '#22c55e')
      : '';

    clockEl.textContent = gpu.graphics_clock_mhz != null ? `${gpu.graphics_clock_mhz}` : '–';

    /* JetPack: the memory gauge shows the unified CPU/OS/GPU pool */
    const memLabelEl = document.getElementById(`gpu-mem-label-${gpu.index}`);
    if (gpu.memory_unified === true) {
      memLabelEl.textContent = 'Unified mem %';
      memLabelEl.title = 'Shared system memory (CPU+OS+GPU)';
    } else {
      memLabelEl.textContent = 'Mem %';
      memLabelEl.title = '';
    }

    const powerEl = document.getElementById(`gpu-power-${gpu.index}`);
    const powerLabelEl = document.getElementById(`gpu-power-label-${gpu.index}`);
    if (gpu.power_w != null) {
      powerEl.textContent = `${gpu.power_w} W`;
      if (gpu.power_limit_w) {
        powerLabelEl.textContent = `Power / ${Math.round(gpu.power_limit_w)} W`;
        powerEl.style.color = colorFor(gpu.power_w / gpu.power_limit_w * 100);
      } else {
        powerLabelEl.textContent = 'Power W';
        powerEl.style.color = '';
      }
    } else {
      powerEl.textContent = '–';
      powerLabelEl.textContent = 'Power W';
      powerEl.style.color = '';
    }

    /* Throttle badges */
    const hwBadge = document.getElementById(`badge-hw-${gpu.index}`);
    const swBadge = document.getElementById(`badge-sw-${gpu.index}`);
    hwBadge.className = `badge ${gpu.throttle?.hw_thermal_slowdown ? 'active' : 'ok'}`;
    swBadge.className = `badge ${gpu.throttle?.sw_thermal_slowdown ? 'active' : 'ok'}`;

    /* Per-GPU combined chart */
    const label = nowLabel();
    const gpuChart = gpuCharts[gpu.index];
    gpuChart.data.labels.push(label);
    gpuChart.data.datasets[0].data.push(gpu.utilization_pct);
    gpuChart.data.datasets[1].data.push(gpu.temperature_c);
    if (gpuChart.data.labels.length > MAX_POINTS) {
      gpuChart.data.labels.shift();
      gpuChart.data.datasets[0].data.shift();
      gpuChart.data.datasets[1].data.shift();
    }
    gpuChart.update('none');
  }
}

/* ------------------------------------------------------------------ */
/* Multi-LLM cards (one card per LLM target, template-cloned)           */
/* ------------------------------------------------------------------ */

/* Compact token count: 999 -> "999", 16374 -> "16.4k" */
function fmtTok(n) { return n >= 1000 ? `${(n / 1000).toFixed(1)}k` : `${n}`; }

/* Per-model line colors (stable: color = position in sorted model list) */
const MODEL_LINE_COLORS = ['#a78bfa', '#f472b6', '#fbbf24', '#34d399',
  '#fb7185', '#60a5fa', '#4ade80', '#facc15'];

/* One LLM card: template clone with scoped lookups and its own Chart.js
   instance. The per-target history buffer (sysState) is the source of
   truth for the chart — update() mirrors it, so tab switches, backend-
   switch resets and stale freezes need no dedicated chart path. Cards
   are destroyed (chart FIRST — constructing a Chart on a canvas that
   still owns one throws, and a throw inside the SSE tick would kill the
   whole handler) when their target or system goes away. */
class LLMCard {
  constructor(container) {
    this.root = document.getElementById('llm-card-template')
      .content.firstElementChild.cloneNode(true);
    this.q = sel => this.root.querySelector(sel);
    this.slotEls = new Map();
    container.appendChild(this.root); // in the DOM BEFORE chart construction
    this.chart = new Chart(this.q('.llm-chart'), {
      type: 'line',
      data: {
        labels: [],
        datasets: [{
          label: 'Gen tokens/s',
          data: [],
          borderColor: '#22d3ee',
          borderWidth: 2,
          pointRadius: 0,
          tension: 0.35,
          fill: { target: 'origin', above: hexToRgba('#22d3ee', 0.15) },
        }],
      },
      options: {
        ...chartDefaults,
        scales: {
          ...chartDefaults.scales,
          y: {
            ...chartDefaults.scales.y,
            max: null, // tokens/s is unbounded – autoscale
            title: { display: true, text: 'tokens/s', color: '#22d3ee', font: { size: 11 } },
          },
        },
      },
    });
  }

  destroy() {
    this.chart.destroy();
    this.root.remove();
  }

  /* Mirror the per-target history buffer into the chart (labels + total
     area + per-model lines tail-aligned with leading nulls). */
  setSeries(hist) {
    const h = hist || { labels: [], gen: [], prompt: [], perModel: {} };
    const chart = this.chart;
    chart.data.labels = h.labels.slice(-MAX_POINTS);
    chart.data.datasets = chart.data.datasets.filter(ds => !ds._perModel);
    chart.data.datasets[0].data = h.gen.slice(-chart.data.labels.length);
    const models = h.perModel && Object.keys(h.perModel).length > 1
      ? Object.keys(h.perModel).sort() : [];
    const nLabels = chart.data.labels.length;
    models.forEach((model, mi) => {
      const arr = h.perModel[model].slice(-nLabels);
      const pad = nLabels - arr.length;
      chart.data.datasets.push({
        label: model,
        data: (pad > 0 ? new Array(pad).fill(null) : []).concat(arr),
        borderColor: MODEL_LINE_COLORS[mi % MODEL_LINE_COLORS.length],
        borderWidth: 1.5,
        pointRadius: 0,
        tension: 0.35,
        fill: false,
        order: -1, // draw over the total area
        _perModel: true,
      });
    });
    chart.options.plugins.legend = {
      display: models.length > 0,
      position: 'bottom',
      labels: { color: '#94a3b8', boxWidth: 12, font: { size: 10 } },
    };
    chart.update('none');
  }

  /* Gauges, badges, sub-lines, slots, usage + process for one entry.
     Logic ported 1:1 from the single-card build; all lookups scoped to
     this card's DOM. displayName: shown when the system has more than
     one target (or the target is explicitly named != "primary"). */
  update(m, displayName, tstate) {
    if (!m || m.status === 'down') {
      // Unreachable: gauges + chart keep their last state (as in the
      // single-card build); the badge carries the down signal.
      const statusEl = this.q('.llm-status');
      statusEl.textContent = 'unreachable';
      statusEl.className = 'llm-status badge down';
      statusEl.removeAttribute('title');
      const modelEl = this.q('.llm-model');
      modelEl.textContent = '–';
      modelEl.removeAttribute('title');
      this.q('.llm-name').style.display = 'none';
      this.q('.llm-backend').textContent = '';
      this.q('.llm-stalled').style.display = 'none';
      this.q('.llm-build').style.display = 'none';
      this.q('.llm-slots-free').style.display = 'none';
      this.q('.llm-peak-ctx').style.display = 'none';
      this.q('.llm-spec-gauge').style.display = 'none';
      this.q('.llm-vllm-details').style.display = 'none';
      this.q('.llm-litellm-details').style.display = 'none';
      this.q('.llm-strata-details').style.display = 'none';
      this.q('.llm-usage').style.display = 'none';
      this.q('.llm-proc').style.display = 'none';
      this.updateSlots([]);
      this.q('.llm-slots-note').style.display = 'none';
      this.setSeries(tstate && tstate.hist);
      return;
    }

    const nameEl = this.q('.llm-name');
    if (displayName) {
      nameEl.textContent = `· ${displayName}`;
      nameEl.style.display = '';
    } else {
      nameEl.style.display = 'none';
    }

    const backend = m.backend || 'llama';
    this.q('.llm-backend').textContent = backend === 'vllm' ? '· vLLM'
      : backend === 'litellm' ? '· LiteLLM'
      : backend === 'strata' ? '· Strata' : '· llama.cpp';

    this.q('.llm-vllm-details').style.display = backend === 'vllm' ? '' : 'none';
    this.q('.llm-litellm-details').style.display = backend === 'litellm' ? '' : 'none';
    this.q('.llm-strata-details').style.display = backend === 'strata' ? '' : 'none';

    /* Status ("stale" = last data held after a failed scrape;
       "loading" = /health answered 503, model still loading — llama only) */
    const statusEl = this.q('.llm-status');
    if (m.status === 'loading') {
      statusEl.textContent = 'loading model';
      statusEl.className = 'llm-status badge warn';
      if (m.health_detail) statusEl.title = m.health_detail;
      else statusEl.removeAttribute('title');
    } else if (m.status === 'stale') {
      statusEl.textContent = 'stale';
      statusEl.className = 'llm-status badge warn';
      statusEl.removeAttribute('title');
    } else if (m.sleeping) {
      statusEl.textContent = 'sleeping';
      statusEl.className = 'llm-status badge warn';
      statusEl.removeAttribute('title');
    } else {
      statusEl.textContent = 'up';
      statusEl.className = 'llm-status badge ok';
      statusEl.removeAttribute('title');
    }
    const modelEl = this.q('.llm-model');
    modelEl.textContent = m.model != null ? m.model : '–';
    if (m.model_path) modelEl.title = m.model_path;
    else modelEl.removeAttribute('title');

    /* Build info (llama only) */
    const buildEl = this.q('.llm-build');
    if (backend === 'llama' && m.build_info) {
      buildEl.textContent = `build ${m.build_info}`;
      buildEl.style.display = '';
    } else {
      buildEl.style.display = 'none';
    }

    /* Decode-stall flag (llama only) */
    this.q('.llm-stalled').style.display =
      backend === 'llama' && m.stalled === true ? '' : 'none';

    /* Gauges (older builds may omit keys – show '–') */
    const genEl = this.q('.llm-gen');
    const promptEl = this.q('.llm-prompt');
    const busyEl = this.q('.llm-busy');
    const ctxEl = this.q('.llm-ctx');
    const ctxLabelEl = ctxEl.parentElement.querySelector('.gauge-label');

    genEl.textContent = m.gen_tokens_per_s != null ? m.gen_tokens_per_s : '–';
    promptEl.textContent = m.prompt_tokens_per_s != null ? m.prompt_tokens_per_s : '–';
    if (backend === 'llama') {
      // The prompt rate counts cached + uncached tokens (server/CLI
      // accounting); the label shows the last prompt's size and cache share.
      this.q('.llm-prompt-label').textContent = m.prompt_last
        ? `Prompt tokens/s (last 5 reqs) · last ${fmtTok(m.prompt_last.total)} tok · ${m.prompt_last.pct_cached}% cached`
        : `Prompt tokens/s (last 5 reqs) · cached ${m.prompt_cached_tokens_per_s != null ? m.prompt_cached_tokens_per_s : '–'}`;
      busyEl.textContent = `${m.requests_processing ?? 0}/${m.requests_deferred ?? 0}`;
      ctxEl.textContent = m.context_tokens_max != null ? m.context_tokens_max : '–';
      ctxEl.style.color = '';
      ctxLabelEl.textContent = 'Context high-water (tokens)';
    } else if (backend === 'vllm') {
      this.q('.llm-prompt-label').textContent = 'Prompt tokens/s (last 5 reqs)';
      busyEl.textContent = `${m.requests_processing ?? 0}/${m.requests_waiting ?? 0}`;
      const kvPct = m.kv_cache_usage_pct;
      ctxEl.textContent = kvPct != null ? `${kvPct}%` : '–';
      ctxEl.style.color = kvPct != null ? colorFor(kvPct) : '';
      ctxLabelEl.textContent = 'KV cache %';
    } else if (backend === 'strata') {
      // Strata: busy = batch slots running / queued+waiting; KV prefix
      // reuse % replaces context high-water. The prompt gauge is the
      // last-5-requests prefill aggregate (Σ fresh tokens / Σ read
      // time, vLLM-style).
      this.q('.llm-prompt-label').textContent = 'Prompt tokens/s (last 5 reqs)';
      busyEl.textContent = `${m.requests_processing ?? 0}/${m.requests_waiting ?? 0}`;
      const reusePct = m.prefix_cache_hit_pct;
      ctxEl.textContent = reusePct != null ? `${reusePct}%` : '–';
      ctxEl.style.color = reusePct != null ? colorFor(reusePct) : '';
      ctxLabelEl.textContent = 'KV reuse %';
    } else {
      // LiteLLM: provider-side prompt-cache % replaces context high-water
      this.q('.llm-prompt-label').textContent = 'Prompt tokens/s';
      busyEl.textContent = `${m.requests_processing ?? 0} in flight`;
      const pcPct = m.prefix_cache_hit_pct;
      ctxEl.textContent = pcPct != null ? `${pcPct}%` : '–';
      ctxEl.style.color = '';
      ctxEl.title = pcPct != null ? '' :
          'No cached-token reports from the provider (prompt caching not in use)';
      ctxLabelEl.textContent = 'Prompt cache % (provider)';
    }

    /* Spec-decode accept rate (lifetime); hidden when spec decode is off */
    if (m.spec_accept_pct != null) {
      this.q('.llm-spec').textContent = `${m.spec_accept_pct}%`;
      this.q('.llm-spec-gauge').style.display = '';
    } else {
      this.q('.llm-spec-gauge').style.display = 'none';
    }

    /* Free slots + peak context (llama) */
    const freeEl = this.q('.llm-slots-free');
    if ((backend === 'llama' || backend === 'strata') && m.free_slots != null && m.total_slots != null) {
      freeEl.textContent = `${m.free_slots}/${m.total_slots} slots free`;
      freeEl.style.display = '';
    } else {
      freeEl.style.display = 'none';
    }
    const peakEl = this.q('.llm-peak-ctx');
    if (backend === 'llama') {
      const nCtx = (Array.isArray(m.slots) ? m.slots : [])
        .map(s => s.n_ctx).find(v => v != null && v > 0);
      if (m.context_tokens_max != null && nCtx) {
        peakEl.textContent = `peak ctx ${fmtTok(m.context_tokens_max)} / ${fmtTok(nCtx)} (${Math.round(100 * m.context_tokens_max / nCtx)}%)`;
        peakEl.style.display = '';
      } else {
        peakEl.style.display = 'none';
      }
    } else {
      peakEl.style.display = 'none';
    }

    /* Per-slot context usage (llama + Strata batch slots) */
    this.updateSlots((backend === 'llama' || backend === 'strata') && Array.isArray(m.slots) ? m.slots : []);

    /* vLLM / LiteLLM have no slots: keep the llama-specific note hidden
       (updateSlots([]) would otherwise reveal it). */
    if (backend !== 'llama' && backend !== 'strata') {
      this.q('.llm-slots-note').style.display = 'none';
    }

    /* vLLM sub-lines */
    if (backend === 'vllm') {
      const d = this.q('.llm-vllm-details');
      d.querySelector('.d-ttft').textContent = m.ttft_seconds != null ? `TTFT ${m.ttft_seconds}s` : 'TTFT –';
      d.querySelector('.d-itl').textContent = m.itl_ms != null ? ` · ITL ${m.itl_ms}ms` : ' · ITL –';
      d.querySelector('.d-e2e').textContent = m.e2e_latency_seconds != null ? ` · E2E ${m.e2e_latency_seconds}s` : ' · E2E –';
      d.querySelector('.d-prefix').textContent = m.prefix_cache_hit_pct != null ? ` · prefix ${m.prefix_cache_hit_pct}%` : '';
      if (m.config) {
        const c = m.config;
        const parts = [];
        if (c.kv_cache_size_tokens != null) parts.push(`${fmtTok(c.kv_cache_size_tokens)} tok KV`);
        if (c.cache_dtype) parts.push(c.cache_dtype);
        if (c.gpu_memory_utilization != null) parts.push(`mem ${Math.round(c.gpu_memory_utilization * 100)}%`);
        d.querySelector('.d-kv').textContent = parts.length ? ` · ${parts.join(' · ')}` : '';
      } else {
        d.querySelector('.d-kv').textContent = '';
      }
    }

    /* LiteLLM sub-lines */
    if (backend === 'litellm') {
      const d = this.q('.llm-litellm-details');
      d.querySelector('.d-ttft').textContent = m.ttft_seconds != null ? `TTFT ${m.ttft_seconds}s` : 'TTFT –';
      d.querySelector('.d-itl').textContent = m.itl_ms != null ? ` · ITL ${m.itl_ms}ms` : ' · ITL –';
      d.querySelector('.d-e2e').textContent = m.e2e_latency_seconds != null ? ` · E2E ${m.e2e_latency_seconds}s` : ' · E2E –';
      d.querySelector('.d-api').textContent = m.llm_api_latency_seconds != null ? ` · API ${m.llm_api_latency_seconds}s` : ' · API –';
      d.querySelector('.d-prefix').textContent = m.prefix_cache_hit_pct != null ? ` · prefix cache ${m.prefix_cache_hit_pct}%` : '';
      d.querySelector('.d-failed').textContent = m.requests_failed_total != null ? ` · failed ${fmtTok(m.requests_failed_total)}` : '';
    }

    /* Strata sub-lines */
    if (backend === 'strata') {
      const d = this.q('.llm-strata-details');
      d.querySelector('.d-ttft').textContent = m.ttft_seconds != null ? `TTFT ${m.ttft_seconds}s` : 'TTFT –';
      d.querySelector('.d-itl').textContent = m.itl_ms != null ? ` · ITL ${m.itl_ms}ms` : ' · ITL –';
      d.querySelector('.d-e2e').textContent = m.e2e_latency_seconds != null ? ` · E2E ${m.e2e_latency_seconds}s` : ' · E2E –';
      d.querySelector('.d-reuse').textContent = m.prefix_cache_hit_pct != null ? ` · KV reuse ${m.prefix_cache_hit_pct}%` : '';
      const parts = [];
      if (m.state && m.state !== 'idle') parts.push(m.state);
      if (m.live_tok_s != null && m.state !== 'idle') parts.push(`${m.live_tok_s} tok/s live`);
      if (m.config && m.config.version) parts.push(`engine ${m.config.version}`);
      if (m.config && m.config.context) parts.push(`${fmtTok(m.config.context)} ctx`);
      d.querySelector('.d-engine').textContent = parts.length ? ` · ${parts.join(' · ')}` : '';
    }

    /* Usage summary line (per card; hidden when the backend has none) */
    const usageWrap = this.q('.llm-usage');
    const usage = m.usage;
    if (!usage) {
      usageWrap.style.display = 'none';
    } else {
      const parts = [`${fmtTok(usage.total_tokens ?? 0)} tok total`];
      if (usage.gen_avg_tps != null) {
        parts.push(`${fmtTok(usage.gen_tokens ?? 0)} gen @ ${usage.gen_avg_tps} t/s avg (while generating)`);
      } else {
        parts.push(`${fmtTok(usage.gen_tokens ?? 0)} gen`);
      }
      if (usage.prompt_cached_pct != null) {
        parts.push(`${usage.prompt_cached_pct}% prompt cached`);
      }
      if (usage.total_spend_usd != null) {
        parts.push(`spend $${usage.total_spend_usd.toFixed(2)}`);
      }
      const up = fmtUptime(usage.uptime_s);
      if (up != null) parts.push(`up ${up}`);
      this.q('.llm-usage-line').textContent = parts.join(' · ');
      usageWrap.style.display = '';
    }

    /* Process line (llama co-located only; hidden when the backend or
       the attribution rule leaves no `process` — silent, no red state) */
    const procWrap = this.q('.llm-proc');
    const proc = m.process;
    if (!proc) {
      procWrap.style.display = 'none';
    } else {
      const parts = [
        `${proc.rss_gb} GB RSS`,
        `${proc.cpu_pct}% CPU (all cores)`,
        `${proc.threads} thr`,
      ];
      if (m.model_size_gb != null) {
        parts.push(`model ${m.model_size_gb} GB`);
      }
      this.q('.llm-proc-line').textContent = parts.join(' · ');
      procWrap.style.display = '';
    }

    this.setSeries(tstate && tstate.hist);
  }

  /* Per-slot context bars (llama + Strata), scoped to this card. */
  updateSlots(slots) {
    const container = this.q('.llm-slots');
    const seen = new Set();

    for (const slot of slots) {
      const id = slot.id != null ? slot.id : 0;
      seen.add(String(id));

      let el = this.slotEls.get(String(id));
      if (!el) {
        el = document.createElement('div');
        el.innerHTML = `
          <div class="llama-slot-head">
            <span class="llama-slot-label">Slot ${id}</span>
            <span class="llama-slot-capt">–</span>
          </div>
          <div class="llama-slot-bar"><div class="llama-slot-fill"></div></div>`;
        container.appendChild(el);
        this.slotEls.set(String(id), el);
      }

      const pct = slot.context_pct != null ? slot.context_pct : 0;
      const fill = el.querySelector('.llama-slot-fill');
      fill.style.width = `${pct}%`;
      fill.style.background = colorFor(pct);

      let capt = `${slot.context_used != null ? slot.context_used : 0} / ${slot.n_ctx != null ? slot.n_ctx : 0}`;
      if (slot.remain != null) {
        // Active: this task's progress — decoded so far, tokens left to go
        capt += ` · ${fmtTok(slot.decoded ?? 0)} tok · ${fmtTok(slot.remain)} left`;
      } else if (!slot.is_processing && (slot.prompt_total ?? 0) > 0) {
        // Idle but still holding KV-cache context from a finished task
        capt += ` · idle · holding ${fmtTok(slot.prompt_total)} tok`;
      }
      el.querySelector('.llama-slot-capt').textContent = capt;

      const label = el.querySelector('.llama-slot-label');
      label.textContent = `Slot ${id}${slot.is_processing ? ' ●' : ''}`;
      label.classList.toggle('llama-slot-processing', !!slot.is_processing);
    }

    // Remove slot elements that disappeared (e.g. server restarted)
    for (const [id, el] of [...this.slotEls]) {
      if (!seen.has(id)) {
        el.remove();
        this.slotEls.delete(id);
      }
    }

    this.q('.llm-slots-note').style.display =
      slots.length === 0 ? '' : 'none';
  }
}

/* Card registry for the SELECTED system only — per-target history
   buffers live in sysState keyed by system, so switching systems
   destroys the current cards and rebuilds them from the new system's
   buffers (charts mirror the buffers, no state is lost). */
const llmCards = new Map();   // llm target name -> LLMCard
let llmCardsOwner = null;     // system the current cards belong to

/* Reconcile the visible cards against the selected system's targets:
   enter (clone + chart), exit (chart.destroy FIRST, then DOM removal),
   update in place. Called from the SSE tick and on tab switch. */
function renderLLMCards() {
  const sys = sysState.selected;
  if (sys === 'fleet') return;
  const container = document.getElementById('llm-cards-container');
  if (!container) return;
  const s = sysState.systems.get(sys);
  if (!s || !s.metrics) return; // down past hold: keep last rendered
  if (llmCardsOwner !== sys) {
    for (const card of llmCards.values()) card.destroy();
    llmCards.clear();
    llmCardsOwner = sys;
  }
  // Local system: LLM entries come from the top-level payload (its
  // systems[].metrics is a slim fleet projection). Peers: their
  // systems[].metrics (full projection).
  const dm = detailMetrics(sys);
  const entries = (dm && dm.llm_enabled === false) ? []
    : (dm ? normalizeLlms(dm, sys) : []);
  const wanted = new Map(entries.map(e => [e.name, e]));
  for (const [name, card] of [...llmCards]) {
    if (!wanted.has(name)) {
      card.destroy();
      llmCards.delete(name);
    }
  }
  for (const [name, entry] of wanted) {
    let card = llmCards.get(name);
    if (!card) {
      card = new LLMCard(container);
      llmCards.set(name, card);
    }
    // Legacy single "primary" target keeps the old header; named or
    // multi-target setups show each target's name.
    const showName = wanted.size > 1 || name !== 'primary';
    card.update(entry, showName ? name : null, s.llms.get(name));
  }
}

/* ------------------------------------------------------------------ */
/* Uptime formatting for the per-card usage line                       */
/* ------------------------------------------------------------------ */
function fmtUptime(s) {
  if (s == null) return null;
  const d = Math.floor(s / 86400);
  const h = Math.floor((s % 86400) / 3600);
  const m = Math.floor((s % 3600) / 60);
  if (d > 0) return `${d}d ${h}h`;
  if (h > 0) return `${h}h ${m}m`;
  return `${m}m`;
}

/* ------------------------------------------------------------------ */
/* Swap usage + I/O rate card (bottom; hidden when the host has none)  */
/* ------------------------------------------------------------------ */
function updateSwap(m) {
  const card = document.getElementById('swap-card');
  if (!card) return;
  const swap = m.swap;
  if (!swap) {
    card.style.display = 'none';
    return;
  }
  const valEl = document.getElementById('swap-val');
  valEl.textContent = `${swap.used_gb} GB`;
  valEl.style.color = colorFor(swap.pct);
  document.getElementById('swap-label').textContent =
    `Swap used of ${swap.total_gb} GB · ${swap.pct}%`;
  // First scrape has no previous counters: rate keys are absent.
  const io = swap.in_kb_s != null && swap.out_kb_s != null;
  const ioEl = document.getElementById('swap-io');
  ioEl.textContent = io
    ? `I/O: ${swap.in_kb_s} in · ${swap.out_kb_s} out kB/s`
    : 'I/O: – in · – out kB/s (measuring…)';
  ioEl.style.color = (io && (swap.in_kb_s > 0 || swap.out_kb_s > 0))
    ? '#ef4444' : '';
  card.style.display = '';
}

/* ------------------------------------------------------------------ */
/* Host health card (bottom; PSI mem pressure + D-state processes)     */
/* ------------------------------------------------------------------ */
function updateHostHealth(m) {
  const card = document.getElementById('host-health-card');
  if (!card) return;
  const hh = m.host_health;
  if (!hh) {
    card.style.display = 'none';
    return;
  }
  const el = document.getElementById('host-health-line');
  el.textContent = '';
  // Pressure part omitted on hosts without /proc/pressure/memory (macOS).
  if (hh.psi_mem_avg10 != null) {
    el.textContent = `mem pressure ${hh.psi_mem_avg10}% (10s) · `;
  }
  const d = hh.d_state_procs != null ? hh.d_state_procs : 0;
  const span = document.createElement('span');
  span.textContent = `D-state procs: ${d}`;
  span.style.color = d > 0 ? '#ef4444' : '';
  el.appendChild(span);
  card.style.display = '';
}

</script>
</body>
</html>
