# Example configuration for the Resource Dashboard.
#
# Copy this file to `config.yaml` (in the working directory — it is
# auto-detected) or pass it explicitly:
#   python app.py --config /path/to/config.yaml
#
# Precedence: CLI flags > config.yaml > built-in defaults.
# Unknown keys are warned about and ignored; invalid values exit with an
# error. An explicitly passed --config PATH that does not exist exits.

# --- Server -------------------------------------------------------------
# host: 0.0.0.0
# port: 5001
# poll_interval: 1.0            # seconds; must be > 0

# --- LLM backend --------------------------------------------------------
# llama | vllm | litellm | strata
# (auto-detect order: vLLM, LiteLLM, Strata, llama.cpp)
# llm_backend: litellm
# llama_url: http://127.0.0.1:8080
# vllm_url: http://127.0.0.1:5001
# litellm_url: http://127.0.0.1:4000
# litellm_token: sk-...         # Bearer header for require_auth_for_metrics_endpoint
# strata_url: http://127.0.0.1:8080  # Strata inference engine (JSON /metrics)
# llama_enabled: true           # false == --no-llama (the flag wins when passed)

# --- Multiple LLM servers (optional) --------------------------------------
# Scrape several inference servers at once; the UI shows one card per
# target. When `llms:` is present it REPLACES the single-backend keys
# above — mixing both exits with an error ("llms: configured; drop the
# legacy LLM settings ... or remove llms"). Each entry needs a unique
# name ([A-Za-z0-9._-], max 64 chars) and an explicit backend (no
# auto-detect per target); `token` is only used for litellm (Bearer);
# at most one entry may set `primary: true` (default: first entry — the
# primary backs the legacy `llm` payload key and sorts first).
#
# llms:
#   - name: local
#     backend: strata
#     url: http://127.0.0.1:8080
#   - name: gpu-1
#     backend: vllm
#     url: http://192.168.1.30:8000
#   - name: proxy
#     backend: litellm
#     url: http://127.0.0.1:4000
#     token: sk-...
#     primary: true

# --- UI --------------------------------------------------------------------
# System tab shown on page load: local (this host, the default) or
# fleet (the multi-system summary). CLI: --default-view
# default_view: local

# --- Upstream dashboards (multi-system consolidation) --------------------
# Each entry points at another dashboard instance's /api/metrics endpoint.
# The UI shows a Fleet tab (summary + fleet tokens/s chart) plus one tab
# per system. CLI --upstream name=url entries are merged by name; CLI wins
# on duplicates.
#
# upstreams:
#   - name: node-a
#     url: http://node-a.example.com:5001
#   - name: node-b
#     url: http://192.168.1.20:5001
